[project]
name = "gamma-exit"
version = "0.1.0"
description = "Research backtester: gamma-scalping / theta-decay trade-off and optimal exit timing for delta-hedged long options"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Timothy Hsu", email = "timmyhsu07@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "yfinance>=0.2.40",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "QuantLib>=1.33",
    "ruff>=0.4",
    "mypy>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamma_exit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"  # numpy>=2.1 stubs use `type` statements (PEP 695)
ignore_missing_imports = true
